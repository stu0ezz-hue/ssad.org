name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Restore source entry and install dependencies
        run: |
          cp index.source.html index.html
          npm ci

      - name: Build
        run: npm run build

      # The current Pages configuration serves main /(root), so keep a static
      # copy at the repository root as a fallback. The Actions artifact below
      # remains the preferred deployment when Pages is set to GitHub Actions.
      - name: Sync built site to repository root
        run: |
          cp dist/index.html index.html
          rm -rf assets images
          cp -R dist/assets assets
          cp -R dist/images images
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets images .nojekyll
          if git diff --cached --quiet; then
            echo "No static site changes to commit"
          else
            git commit -m "chore: update static GitHub Pages build [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
